<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>react-photo-gallery-adaptive — demo</title>
    <meta name="description" content="Live demo of react-photo-gallery-adaptive: adaptive React photo gallery with aspect-ratio layout, lightbox and view-all modal." />
    <style>
      :root { color-scheme: light dark; --fg: #1a1a1a; --muted: #666; --bg: #fff; --code: #f3f3f3; --link: #0b62d6; }
      @media (prefers-color-scheme: dark) {
        :root { --fg: #eaeaea; --muted: #9a9a9a; --bg: #121212; --code: #1f1f1f; --link: #6aa8ff; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
      .page { max-width: 1000px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      h2 { margin: 40px 0 12px; font-size: 18px; }
      p { margin: 0 0 12px; color: var(--muted); }
      .note { font-size: 14px; }
      pre { background: var(--code); padding: 10px 14px; border-radius: 8px; overflow-x: auto; }
      .links { display: flex; gap: 16px; }
      a { color: var(--link); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
